<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Agent Control Center</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #00f5ff;
            --primary-dim: rgba(0, 245, 255, 0.15);
            --accent: #0080ff;
            --danger: #ff3366;
            --success: #00ff88;
            --warning: #ffaa00;
            --bg-dark: #0a0a12;
            --bg-card: rgba(20, 20, 30, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #8888aa;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text);
            min-height: 100vh; padding: 20px; display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 1280px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 960px) { .container { grid-template-columns: 1fr; } }
        .card {
            background: var(--bg-card); padding: 28px; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); border: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        .header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
        h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .connection-badge { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .connection-badge.connected { background: rgba(0, 255, 136, 0.1); color: var(--success); border: 1px solid rgba(0, 255, 136, 0.3); }
        .connection-badge.disconnected { background: rgba(255, 51, 102, 0.1); color: var(--danger); border: 1px solid rgba(255, 51, 102, 0.3); }
        label { display: block; margin: 16px 0 8px; font-weight: 600; font-size: 11px; color: var(--text-dim); text-transform: uppercase; }
        select { width: 100%; padding: 12px 16px; background: rgba(30, 30, 45, 0.8); border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
        .drivetrain-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 20px auto; }
        .joy-btn { background: #2d2d3a; color: var(--text); border: 1px solid var(--border); padding: 18px; border-radius: 12px; font-weight: 700; cursor: pointer; text-align: center; }
        .joy-btn:hover { border-color: var(--primary); }
        .stop-btn { background: var(--danger) !important; }
        .slider-container { background: rgba(30, 30, 45, 0.6); padding: 14px 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .slider-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
        .slider-val { color: var(--primary); font-weight: 700; }
        input[type="range"] { width: 100%; height: 6px; background: rgba(45, 45, 58, 0.8); border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--primary); border-radius: 50%; }
        .deploy-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; }
        .log-panel { grid-column: 1 / -1; }
        .log-entries { max-height: 180px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--primary); }
        .log-entry { padding: 6px 12px; border-left: 3px solid var(--primary); background: rgba(0, 245, 255, 0.02); margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card header">
        <div>
            <h1>ARMPI PRO MASTER CONTROLLER</h1>
            <div style="font-size:11px; color:var(--text-dim);">EMQX ROUTING INTERFACE</div>
        </div>
        <div id="statusBadge" class="connection-badge disconnected">
            <span id="statusText">CONNECTING...</span>
        </div>
    </div>

    <div class="card">
        <h2>Autonomous Configuration</h2>
        <label>Target Object</label>
        <select id="targetObject">
            <option value="sports ball">⚽ Tennis Ball</option>
            <option value="cup">🥛 Cup</option>
        </select>
        <label>Target Color</label>
        <select id="targetColor">
            <option value="yellow">Yellow</option>
            <option value="red">Red</option>
        </select>
        <label>Confidence Limit</label>
        <div class="slider-container">
            <div class="slider-header"><span>YOLO Barrier</span><span class="slider-val" id="confValText">75%</span></div>
            <input type="range" id="confidenceSlider" min="10" max="99" value="75" oninput="document.getElementById('confValText').innerText=this.value+'%'">
        </div>
        <label>Mission Selection</label>
        <select id="missionMode">
            <option value="track">📍 Track Only</option>
            <option value="grab">🦾 Adaptive Grab</option>
        </select>
        <button class="deploy-btn" onclick="deployAutonomousConfig()">🚀 Transmit Mission Profile</button>
    </div>

    <div class="card">
        <h2>Manual Diagnostics Override</h2>
        <label>Chassis Motion Control</label>
        <div class="drivetrain-grid">
            <div></div><div class="joy-btn" onclick="sendDriveCmd(60, 0)">▲</div><div></div>
            <div class="joy-btn" onclick="sendDriveCmd(0, -60)">◀</div>
            <div class="joy-btn stop-btn" onclick="sendDriveCmd(0, 0)">■</div>
            <div class="joy-btn" onclick="sendDriveCmd(0, 60)">▶</div>
            <div></div><div class="joy-btn" onclick="sendDriveCmd(-60, 0)">▼</div><div></div>
        </div>

        <label>Joint Servos</label>
        <div class="slider-container">
            <div class="slider-header"><span>Base Rotation</span><span class="slider-val" id="vBase">90°</span></div>
            <input type="range" min="0" max="180" value="90" oninput="moveServo('base', this.value)">
        </div>
        <div class="slider-container">
            <div class="slider-header"><span>Shoulder Pitch</span><span class="slider-val" id="vShoulder">30°</span></div>
            <input type="range" min="0" max="180" value="30" oninput="moveServo('shoulder', this.value)">
        </div>
        <div class="slider-container">
            <div class="slider-header"><span>Elbow Pitch</span><span class="slider-val" id="vElbow">110°</span></div>
            <input type="range" min="0" max="180" value="110" oninput="moveServo('elbow', this.value)">
        </div>
    </div>

    <div class="card log-panel">
        <h2>Live Telemetry Stream</h2>
        <div class="log-entries" id="logEntries"></div>
    </div>
</div>

<script>
    const TOPIC_PREFIX = "efe_robot_2026/pi/cmd";
    const uniqueId = "dash_" + Math.random().toString(36).substring(2, 8);
    
    // Connect to EMQX Public Broker using secure WebSockets
    const client = new Paho.MQTT.Client("broker.emqx.io", Number(8084), "/mqtt", uniqueId);

    client.onConnectionLost = (res) => {
        document.getElementById("statusBadge").className = "connection-badge disconnected";
        document.getElementById("statusText").innerText = "DISCONNECTED";
        addLog("❌ Broker link down: " + res.errorMessage + ". Reconnecting...");
        setTimeout(() => { if(!client.connected) connect(); }, 3000);
    };

    function connect() {
        client.connect({
            useSSL: true,
            timeout: 10,
            keepAliveInterval: 60,
            mqttVersion: 4,
            onSuccess: () => {
                document.getElementById("statusBadge").className = "connection-badge connected";
                document.getElementById("statusText").innerText = "LINK ACTIVE";
                addLog("✅ Securely connected to EMQX Broker.");
            },
            onFailure: (err) => {
                addLog("❌ Connection failed: " + err.errorMessage);
            }
        });
    }

    function addLog(msg) {
        const container = document.getElementById('logEntries');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        container.insertBefore(entry, container.firstChild);
    }

    function sendMqtt(topic, payload) {
        if (!client.connected) { addLog("⚠️ Command blocked: Network channel offline."); return; }
        const message = new Paho.MQTT.Message(JSON.stringify(payload));
        message.destinationName = topic;
        client.send(message);
    }

    function sendDriveCmd(speed, steer) {
        const payload = { speed: speed, steer: steer, hold: (speed === 0 && steer === 0) };
        sendMqtt(TOPIC_PREFIX + "/move", payload);
        addLog(`🚗 Transmitted Movement -> Spd: ${speed} | Str: ${steer}`);
    }

    function moveServo(joint, value) {
        document.getElementById('v' + joint.charAt(0).toUpperCase() + joint.slice(1)).innerText = value + "°";
        const payload = { manual_override: true, joint: joint, angle: parseInt(value) };
        sendMqtt(TOPIC_PREFIX + "/arm", payload);
    }

    function deployAutonomousConfig() {
        const payload = {
            action: document.getElementById("missionMode").value,
            force_limit: 2000,
            target_object: document.getElementById("targetObject").value,
            target_color: document.getElementById("targetColor").value,
            confidence_threshold: parseInt(document.getElementById("confidenceSlider").value) / 100
        };
        sendMqtt("efe_robot_2026/dashboard/config", payload);
        addLog("🚀 Synchronized target parameters across network cluster.");
    }

    connect();
</script>
</body>
</html>
